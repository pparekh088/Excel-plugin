[project]
name = "ledger-server"
version = "0.0.1"
description = "Ledger Agent API - backend for the Ledger autonomous Excel engineering agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "jsonschema>=4.23,<5",
    "redis>=5.0,<6",
    "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledger_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
